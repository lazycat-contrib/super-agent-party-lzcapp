name: Super Agent Party
package: cloud.lazycat.app.super-agent-party
version: 0.2.7
min_os_version: 1.3.8
description: 🚀 一款拥有无限可能的3D版AI桌面伴侣！
homepage: https://github.com/heshengtao/super-agent-party
author: heshengtao
application:
    subdomain: super-agent-party
    background_task: true

    upstreams:
        - location: /
          backend: http://super-agent-party:3456/
services:
    super-agent-party:
        # ailm32442/super-agent-party:0.2.7
        image: registry.lazycat.cloud/czyt/ailm32442/super-agent-party:ca7de7619c64119a
        binds:
            - /lzcapp/var/data:/app/data
