application:
  subdomain: super-agent-party
  background_task: true
  upstreams:
    - location: /
      backend: http://gateway:3456/
services:
  backend:
    # ailm32442/super-agent-party:0.3.4
    # upstream: ailm32442/super-agent-party:0.4.2
    image: registry.lazycat.cloud/czyt/ailm32442/super-agent-party:014c8a6d20f481c1
    binds:
      - /lzcapp/var/data:/app/data
  gateway:
    # ailm32442/nigix-for-sap:0.1.1
    image: registry.lazycat.cloud/czyt/ailm32442/nigix-for-sap:cec0a6a3cbb6eb5e
    environment:
      - JWT_SECRET={{ stable_secret "jwt$sa" }}
      - INIT_USER={{.U.admin_username}}
      - INIT_PASS={{.U.init_password}}
      # 如果忘记密码，将下面设置为 true 重启容器即可重置为 root/pass，重置完记得改回 false 或删除
      - FORCE_RESET=false
    binds:
      - /lzcapp/var/gateway:/data # 持久化保存密码修改后的状态
    depends_on:
      - backend
