version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/super-agent-party.lpk

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: backend

build:
  run_buildscript: false

images:
  - id: backend
    target: service
    service: backend
    source: ailm32442/super-agent-party
    channel: stable
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: Super Agent Party
    summary: 一款拥有无限可能的 3D AI 桌面伴侣
